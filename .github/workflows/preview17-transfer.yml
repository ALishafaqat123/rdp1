name: Temporary Preview 17 Transfer

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview17-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified private Preview 17 installer
        env:
          URL_B64: 
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl -L --fail --retry 4 "$URL" -o Rizwan-Media-Saver-PC-v1.2.0-Preview17-Setup.exe
          echo "b2b314834af8c93cd83bfde029aa30407f88440031e6f3f5f34d2c0e951facf3  Rizwan-Media-Saver-PC-v1.2.0-Preview17-Setup.exe" | sha256sum -c -

      - name: Create temporary public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete preview17-chat-transfer --yes --cleanup-tag 2>/dev/null || true
          gh release create preview17-chat-transfer \
            --title "Preview 17 Temporary Transfer" \
            --notes "Temporary test installer transfer only. No source code." \
            Rizwan-Media-Saver-PC-v1.2.0-Preview17-Setup.exe
