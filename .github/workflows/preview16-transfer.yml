name: Temporary Preview 16 Transfer

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview16-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      SIGNED_URL_B64: 
      EXPECTED_SHA256: 96e76d538c0f9cae6f8b1ddc821fcc8f30d8ad2bb449e8ad95985f6b8bc0c1a1
      FILE_NAME: Rizwan-Media-Saver-PC-v1.2.0-Preview16-Setup.exe
      TAG: preview16-chat-transfer
    steps:
      - name: Remove old Preview 15 transfer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview15-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true

      - name: Download verified private asset
        shell: bash
        run: |
          set -euo pipefail
          url=$(printf '%s' "$SIGNED_URL_B64" | base64 -d)
          curl -L --fail --retry 5 --retry-all-errors "$url" -o "$FILE_NAME"
          actual=$(sha256sum "$FILE_NAME" | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          ls -lh "$FILE_NAME"

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$FILE_NAME" --repo ALishafaqat123/rdp1 --title "Temporary Preview 16 Transfer" --notes "Temporary transfer asset."

      - name: Record transfer success
        shell: bash
        run: |
          mkdir -p .transfer-status
          printf 'SUCCESS\nfile=%s\nsha256=%s\n' "$FILE_NAME" "$EXPECTED_SHA256" > .transfer-status/preview16.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .transfer-status/preview16.txt
          git commit -m "Record Preview 16 transfer success" || exit 0
          git push
