name: Temporary Preview 12 Transfer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview12-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download private signed asset
        shell: bash
        env:
          SIGNED_URL_B64: 
        run: |
          set -euo pipefail
          mkdir -p transfer
          printf '%s' "$SIGNED_URL_B64" | base64 -d > /tmp/url.txt
          curl -L --fail --retry 5 --retry-all-errors "$(cat /tmp/url.txt)" -o transfer/Rizwan-Media-Saver-PC-v1.2.0-Preview12-Setup.exe
          test "$(stat -c%s transfer/Rizwan-Media-Saver-PC-v1.2.0-Preview12-Setup.exe)" = "168526354"
          echo "a1d89146af0fa9b2ecc46b64032fab4193b5a8940d6aec3d91d775f98596ea3e  transfer/Rizwan-Media-Saver-PC-v1.2.0-Preview12-Setup.exe" | sha256sum -c -

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete preview12-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release delete preview11-hotfix1-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create preview12-chat-transfer --repo ALishafaqat123/rdp1 --title "Temporary Preview 12 Transfer" --notes "Temporary transfer asset."
          gh release upload preview12-chat-transfer --repo ALishafaqat123/rdp1 transfer/Rizwan-Media-Saver-PC-v1.2.0-Preview12-Setup.exe --clobber
