name: Temporary Preview 10 Transfer

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview10-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download private signed asset
        shell: bash
        env:
          SIGNED_B64: ""
        run: |
          set -euo pipefail
          url=$(printf '%s' "$SIGNED_B64" | base64 -d)
          curl -L --fail --retry 4 --retry-all-errors "$url" -o Rizwan-Media-Saver-PC-v1.2.0-Preview10-Setup.exe
          test -s Rizwan-Media-Saver-PC-v1.2.0-Preview10-Setup.exe

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete preview10-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create preview10-chat-transfer --repo ALishafaqat123/rdp1 --title "Temporary Preview 10 Transfer" --notes "Temporary transfer asset."
          gh release upload preview10-chat-transfer --repo ALishafaqat123/rdp1 Rizwan-Media-Saver-PC-v1.2.0-Preview10-Setup.exe --clobber
