name: Temporary Preview 8 Transfer
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/preview8-transfer.yml" ]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download private signed asset
        env:
          SOURCE_URL_B64: ""
        run: |
          set -euo pipefail
          SOURCE_URL=$(printf '%s' "$SOURCE_URL_B64" | base64 -d)
          curl -L --fail --retry 4 --retry-all-errors "$SOURCE_URL" -o Rizwan-Media-Saver-PC-v1.2.0-Preview8-Setup.exe
          test -s Rizwan-Media-Saver-PC-v1.2.0-Preview8-Setup.exe
      - name: Publish temporary public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="preview8-chat-transfer"
          gh release delete "$tag" --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --repo ALishafaqat123/rdp1 --title "Temporary Preview 8 Transfer" --notes "Temporary transfer asset."
          gh release upload "$tag" --repo ALishafaqat123/rdp1 Rizwan-Media-Saver-PC-v1.2.0-Preview8-Setup.exe --clobber
