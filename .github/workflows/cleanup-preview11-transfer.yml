name: Cleanup Preview 11 Transfer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/cleanup-preview11-transfer.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview11-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag || true
