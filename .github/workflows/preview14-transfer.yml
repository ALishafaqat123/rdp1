name: Temporary Preview 14 Transfer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview14-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      SIGNED_URL_B64: 
      EXPECTED_SHA256: 2ed5d7394766b49667f8e2d213f59d3877728d2a3f0b2e77f11652b7a0f2a24c
      FILE_NAME: Rizwan-Media-Saver-PC-v1.2.0-Preview14-Setup.exe
      TAG: preview14-chat-transfer
    steps:
      - name: Remove old Preview 13 transfer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview13-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true

      - name: Download verified private asset
        shell: bash
        run: |
          set -euo pipefail
          url=$(printf '%s' "$SIGNED_URL_B64" | base64 -d)
          curl -L --fail --retry 5 --retry-all-errors "$url" -o "$FILE_NAME"
          actual=$(sha256sum "$FILE_NAME" | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          ls -lh "$FILE_NAME"

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$FILE_NAME" --repo ALishafaqat123/rdp1 --title "Temporary Preview 14 Transfer" --notes "Temporary transfer asset."

      - name: Record transfer success
        shell: bash
        run: |
          mkdir -p .transfer-status
          printf 'SUCCESS\nfile=%s\nsha256=%s\n' "$FILE_NAME" "$EXPECTED_SHA256" > .transfer-status/preview14.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .transfer-status/preview14.txt
          git commit -m "Record Preview 14 transfer success" || exit 0
          git push
