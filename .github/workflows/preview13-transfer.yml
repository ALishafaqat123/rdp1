name: Temporary Preview 13 Transfer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview13-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      SIGNED_URL_B64: 
      EXPECTED_SHA256: 4b638efbaf5c341b23fa0c6765277de91e9f70e5da610c49983bf8496615a7c3
      FILE_NAME: Rizwan-Media-Saver-PC-v1.2.0-Preview13-Setup.exe
      TAG: preview13-chat-transfer
    steps:
      - name: Remove old Hotfix 2 transfer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview12-hotfix2-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true

      - name: Download verified private asset
        shell: bash
        run: |
          set -euo pipefail
          url=$(printf '%s' "$SIGNED_URL_B64" | base64 -d)
          curl -L --fail --retry 5 --retry-all-errors "$url" -o "$FILE_NAME"
          actual=$(sha256sum "$FILE_NAME" | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          ls -lh "$FILE_NAME"

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$FILE_NAME" --repo ALishafaqat123/rdp1 --title "Temporary Preview 13 Transfer" --notes "Temporary transfer asset."

      - name: Record transfer success
        shell: bash
        run: |
          mkdir -p .transfer-status
          printf 'SUCCESS\nfile=%s\nsha256=%s\n' "$FILE_NAME" "$EXPECTED_SHA256" > .transfer-status/preview13.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .transfer-status/preview13.txt
          git commit -m "Record Preview 13 transfer success" || exit 0
          git push
