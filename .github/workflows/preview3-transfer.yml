name: Temporary Preview 3 Transfer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview3-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download private signed asset
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/url
          curl -L --fail --retry 3 "$(cat /tmp/url)" -o Rizwan-Media-Saver-PC-v1.2.0-Preview3-Setup.exe
          ls -lh Rizwan-Media-Saver-PC-v1.2.0-Preview3-Setup.exe

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete preview3-chat-transfer --yes --cleanup-tag 2>/dev/null || true
          gh release create preview3-chat-transfer --title 'Temporary Preview 3 Transfer' --notes 'Temporary transfer asset.'
          gh release upload preview3-chat-transfer Rizwan-Media-Saver-PC-v1.2.0-Preview3-Setup.exe --clobber

