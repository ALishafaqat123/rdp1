name: Temporary Preview 12 Hotfix 2 Transfer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview12-hotfix2-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      SIGNED_URL_B64: 
      EXPECTED_SHA256: 781892592d59ed84f8a8f85a66fbeb53290498622de80e704fb66692c982f4e7
      FILE_NAME: Rizwan-Media-Saver-PC-v1.2.0-Preview12-Hotfix2-Setup.exe
      TAG: preview12-hotfix2-chat-transfer
    steps:
      - name: Download verified private asset
        shell: bash
        run: |
          set -euo pipefail
          url=$(printf '%s' "$SIGNED_URL_B64" | base64 -d)
          curl -L --fail --retry 5 --retry-all-errors "$url" -o "$FILE_NAME"
          actual=$(sha256sum "$FILE_NAME" | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          ls -lh "$FILE_NAME"

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$FILE_NAME" --repo ALishafaqat123/rdp1 --title "Temporary Preview 12 Hotfix 2 Transfer" --notes "Temporary transfer asset."
