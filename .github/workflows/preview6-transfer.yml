name: Temporary Preview 6 Transfer

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preview6-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download private signed asset
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/url
          curl -L --fail --retry 3 "$(cat /tmp/url)" -o Rizwan-Media-Saver-PC-v1.2.0-Preview6-Setup.exe
          ls -lh Rizwan-Media-Saver-PC-v1.2.0-Preview6-Setup.exe

      - name: Publish temporary public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete preview6-chat-transfer --repo ALishafaqat123/rdp1 --yes --cleanup-tag 2>/dev/null || true
          gh release create preview6-chat-transfer --repo ALishafaqat123/rdp1 --title 'Temporary Preview 6 Transfer' --notes 'Temporary transfer asset.'
          gh release upload preview6-chat-transfer --repo ALishafaqat123/rdp1 Rizwan-Media-Saver-PC-v1.2.0-Preview6-Setup.exe --clobber
